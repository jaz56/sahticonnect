# Profil "docker" : PostgreSQL et adresses des autres services par variables d'environnement
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres-orchestrateur:5432/orchestrateur}
    username: ${DB_USER:orchestrateur}
    password: ${DB_PASSWORD:orchestrateur}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always   # exécute schema.sql (séquence des workflows) aussi sur PostgreSQL
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update

sahti:
  telemetrie:
    adresse: ${TELEMETRIE_ADRESSE:telemetrie-service:9090}
  cnam:
    url: ${CNAM_URL:http://dossier-cnam-service:8081/ws}
  portail:
    url: ${PORTAIL_URL:http://portail-patient-service:8082}
  dashboard:
    url: ${DASHBOARD_URL:http://dashboard-medical-service:8083/graphql}

# Profil par défaut : H2 en mémoire + console H2 (http://localhost:8081/h2-console)
server:
  port: 8081

spring:
  application:
    name: dossier-cnam-service
  datasource:
    url: jdbc:h2:mem:cnam;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    tn.sahticonnect.cnam: INFO

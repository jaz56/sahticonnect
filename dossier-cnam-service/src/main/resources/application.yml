# Profil par défaut : H2 en mémoire + console H2 (http://localhost:8081/h2-console)
server:
  port: 8081
  # Derrière l'API Gateway : les en-têtes X-Forwarded-Host/Port/Proto/Prefix sont pris en compte (ForwardedHeaderFilter),
  # pour que le WSDL lu via http://localhost:8080/api/cnam/ws annonce l'adresse de la gateway (transformWsdlLocations).
  # Sans ces en-têtes (accès direct sur 8081), le WSDL garde l'adresse directe.
  forward-headers-strategy: framework

spring:
  application:
    name: dossier-cnam-service
  datasource:
    url: jdbc:h2:mem:cnam;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  # même format dans tous les services : [identifiant de corrélation] en tête de ligne (MDC correlationId)
  pattern:
    console: "[%X{correlationId:--}] %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %m%n%wEx"
  level:
    tn.sahticonnect.cnam: INFO

# Healthcheck Docker : GET /actuator/health. Avec les sondes, l'état inclut readinessState : le service n'est
# « UP » qu'une fois démarré ET les données de test chargées (CommandLineRunner terminés).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

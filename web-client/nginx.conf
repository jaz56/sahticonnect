# Client Angular servi par nginx. Le navigateur appelle ensuite la gateway (http://localhost:8080) directement :
# nginx ne sert que les fichiers statiques.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Routing Angular : /medecin/patients/PAT-0001 n'existe pas sur le disque → index.html, le routeur fait le reste
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache (il référence les fichiers du dernier build)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # fichiers du build : nom avec empreinte (main-XXXX.js) → cache long
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
